[project]
name = "gloo-api"
version = "0.1.0"
description = "An API for the Gloo CRM platform"
readme = "README.md"
authors = [
    { name = "kMlad", email = "kmlad@kmlad.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.fastapi]
entrypoint = "app.main:app"
