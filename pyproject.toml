[project]
name = "gloo-api"
version = "0.1.0"
description = "An API for the Gloo CRM platform"
readme = "README.md"
authors = [
    { name = "kMlad", email = "kmlad@kmlad.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
gloo-api = "gloo_api:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
